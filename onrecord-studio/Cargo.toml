[workspace]
members = ["src-tauri"]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
incremental = false
strip = "symbols"
panic = "abort"

# calamine 0.36.1 with a fast path in `XlsxCellReader::next_cell` (vendor/calamine/PATCHED.md).
[patch.crates-io]
calamine = { path = "vendor/calamine" }
