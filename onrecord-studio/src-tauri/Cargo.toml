[package]
name = "onrecord-studio-lib"
version = "1.0.0"
edition = "2021"

# The app binary is named for the product; `onrecord-studio-lib` stays the library crate name.
[[bin]]
name = "onrecord-studio"
path = "src/main.rs"

[[bin]]
name = "onrecord-pack-builder"
path = "src/bin/pack_builder.rs"
required-features = ["pack-builder"]

[features]
default = []
# Exposes `test_support` to the crate's integration tests (enabled by its own dev-dependency).
test-support = []
# Statically links the native StoreKit 2 verifier and changes the runtime gate from development
# access to fail-closed Mac App Store transaction enforcement.
app-store = []
# Replaces development access with the account sign-in and server-signed entitlement gate for the
# Developer ID build. Mutually exclusive with `app-store`. The native account bridge is
# native/AppAccount.swift.
# The signed updater and its restart plugin are linked only here, so the App Store build cannot
# self-update. An update replaces the binary and never touches the license.
direct-license = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]
# The data-pack builder (`onrecord-pack-builder`): Keychain access for the publisher key (a
# macOS-only dependency, so the feature also builds on the Linux snapshot runner) and Parquet
# writing. Never enabled for the app.
pack-builder = ["dep:security-framework", "duckdb/parquet"]

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Keep the async runtime explicit: this binary uses filesystem, networking, timers, channels,
# blocking workers, and the multithreaded scheduler, but not Tokio's process/signal/test extras.
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
# Use rustls instead of the platform/OpenSSL default TLS stack so releases are self-contained and
# reproducible across macOS, Windows, and Linux. Response compression is enabled because public
# APIs and document indexes commonly return gzip/brotli/deflate/zstd payloads.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "form", "stream", "rustls", "http2", "gzip", "brotli", "deflate", "zstd"] }
# C2PA manifest reading and signature validation.
# `rust_native_crypto` keeps the crypto in Rust instead of linking OpenSSL, matching the rustls
# choice made for reqwest above: releases stay self-contained and reproducible across platforms.
# `fetch_remote_manifests` is deliberately NOT enabled. It makes verification follow a URL embedded
# in the asset being examined, which for an evidence tool means the act of checking a document
# reaches out to a server the document's author chose. Verification here reads only local bytes.
c2pa = { version = "0.90.16", default-features = false, features = ["rust_native_crypto", "file_io", "pdf"] }
futures-util = "0.3"
scraper = "0.27"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", default-features = false, features = ["bundled", "limits"] }
duckdb = { version = "1.10505.0", features = ["bundled", "json", "appender-arrow"] }
lopdf = "0.44"
png = "0.18"
calamine = { version = "0.36", features = ["dates"] }
msg_parser = "0.3"
zip = { version = "1.1.4", default-features = false, features = ["deflate", "bzip2", "zstd", "lzma"] }
tar = "0.4"
flate2 = "1.1"
bzip2 = "0.6.1"
xz2 = { version = "0.1.7", features = ["static"] }
zstd = "0.13"
sha2 = "0.11.0"
ed25519-dalek = "2.2.0"
rand = "0.8"
regex = "1"
aho-corasick = "1"
thiserror = "2.0.20"
uuid = { version = "1.25.0", features = ["v4"] }
window-vibrancy = "0.8.0"
fastembed = { version = "6.1.0", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
csv = "1.3"
sqlparser = { version = "0.59", features = ["visitor"] }
# Compound File Binary reader — reads MAPI property streams inside .msg files (e.g.
# PR_TRANSPORT_MESSAGE_HEADERS) so the email-thread-gap detector can pull In-Reply-To/References
# from the RFC 5322 header block that msg_parser's public Headers type does not expose. Promoted
# from dev-dependencies to production for `parsers::email_headers`.
cfb = "0.14.0"
tauri-plugin-opener = "2"
tauri-plugin-updater = { version = "2.13.1", optional = true }
tauri-plugin-process = { version = "2.4.0", optional = true }
outlook-pst = "1.2.0"
compressed-rtf = "1.0.1"
roxmltree = "0.21.1"
deflate64 = "0.1.12"

# `statvfs`, for the free-space check before a database storage rewrite. Already in the dependency
# tree; named directly so the check stays safe code.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", optional = true }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
tempfile = "3"
onrecord-studio-lib = { path = ".", features = ["test-support"] }
