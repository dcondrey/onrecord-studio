name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Warnings are errors in CI. Registry dependencies are unaffected (--cap-lints allow).
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: onrecord-studio

permissions:
  contents: read

jobs:
  # Fast feedback: everything that does not need the Tauri system libraries.
  checks:
    name: Lint, types, and IPC contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: onrecord-studio/.nvmrc
          cache: npm
          cache-dependency-path: onrecord-studio/package-lock.json
      - run: npm ci
      - name: IPC contract
        run: npm run check:ipc
      - name: Help coverage
        run: npm run check:help
      - name: Methods document
        run: npm run check:methods
      - name: Mac App Store configuration
        run: npm run check:app-store-config
      - name: Direct-distribution configuration
        # notarize-direct --check needs Xcode tools; the macOS bundle job covers the full check.
        run: node scripts/prepare-direct.mjs --check
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Frontend unit tests
        run: npm run test:unit

  ui-review:
    name: UI review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: onrecord-studio/.nvmrc
          cache: npm
          cache-dependency-path: onrecord-studio/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture the UI review (real data, 1280 wide)
        # Every view's populated state, plus empty, loading and error for the top-level views.
        run: npm run ui:review -- "$RUNNER_TEMP/ui-review" --widths=1280 --states=top --concurrency=2
      - name: Accessibility regressions against ui-review/axe-baseline.json
        run: npm run ui:check -- "$RUNNER_TEMP/ui-review"
      - name: Upload the screenshots
        # A convenience for review: a full artifact quota must not fail the accessibility gate.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-review
          path: ${{ runner.temp }}/ui-review
          if-no-files-found: warn
          retention-days: 5

  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pushes and pull requests build on Linux; a manual run adds macOS and Windows, whose runner
        # minutes cost several times more.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    env:
      # Debug info for the bundled DuckDB alone exhausts a hosted runner's disk.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Free runner disk
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        working-directory: /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: onrecord-studio
      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libglib2.0-dev
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: StoreKit licensing bridge
        if: matrix.os == 'macos-latest'
        run: cargo check --workspace --all-targets --features app-store
      - name: Release-scale performance budgets
        if: matrix.os == 'ubuntu-latest'
        env:
          ONRECORD_PERFORMANCE_TARGET_DIR: target
        run: npm run test:release-performance

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: onrecord-studio/.nvmrc
          cache: npm
          cache-dependency-path: onrecord-studio/package-lock.json
      - run: npm ci
      - name: npm advisories
        # Shipped dependencies only. The build tooling's advisories (Tailwind 3's file-watching
        # chain) need the Tailwind 4 migration; they never reach the app bundle.
        run: npm audit --omit=dev --audit-level=high
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Rust advisories
        # Reviewed advisories with no reachable path or no upgrade (Tauri's GTK3 stack, rsa's
        # Marvin attack) are listed in .cargo/audit.toml, so a genuinely new advisory still fails.
        run: cargo audit

  bundle:
    name: Bundle ${{ matrix.os }}
    needs: [checks, rust]
    # Bundles are compile evidence for every platform; built on a manual run only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: onrecord-studio/.nvmrc
          cache: npm
          cache-dependency-path: onrecord-studio/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: onrecord-studio
      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libglib2.0-dev
      - run: npm ci
      - name: Direct-distribution tooling
        if: matrix.os == 'macos-latest'
        run: npm run check:direct-config
      - name: Build bundle
        # Unsigned on CI: signing and notarization require secrets this workflow does not hold.
        # Only the macOS builds are distributed (docs/release.md, docs/release-direct.md); the
        # Windows and Linux bundles are compile evidence.
        run: npx tauri build --ci
      - name: Upload the bundle
        # Compile evidence: a full artifact quota must not hide whether the bundle built.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: onrecord-studio-${{ matrix.os }}
          path: |
            onrecord-studio/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
